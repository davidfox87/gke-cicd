apiVersion: apps/v1
kind: Deployment
metadata:
  name: gcs-proxy                 # ← better name than hello-world-demo
  namespace: grafana              # ← forces deployment into grafana namespace
  labels:
    app: gcs-proxy
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gcs-proxy
  template:
    metadata:
      labels:
        app: gcs-proxy
    spec:
      serviceAccountName: grafana           # ← uses the same SA your Grafana pods use
      containers:
      - name: gcs-proxy
        image: us-central1-docker.pkg.dev/top-chain-475617-p7/test-repo/go-http-server:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: special-config
              key: ENV
---
apiVersion: v1
kind: Service
metadata:
  name: gcs-proxy
  namespace: grafana
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: gcs-proxy

