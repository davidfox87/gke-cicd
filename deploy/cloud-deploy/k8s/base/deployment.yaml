apiVersion: apps/v1
kind: Deployment
metadata:
  name: my-server                 # ← better name than hello-world-demo
  namespace: team-1              # ← forces deployment into team-1 namespace
  labels:
    app: my-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: my-server
  template:
    metadata:
      labels:
        app: my-server
    spec:
      serviceAccountName: sa           # ← uses the same SA your Grafana pods use
      containers:
      - name: my-server
        image: us-central1-docker.pkg.dev/top-chain-475617-p7/test-repo/go-http-server:latest
        ports:
        - containerPort: 8080
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            cpu: 100m
            memory: 128Mi
        env:
        - name: ENV
          valueFrom:
            configMapKeyRef:
              name: special-config
              key: ENV
---
apiVersion: v1

kind: Service
metadata:
  name: my-server
  namespace: team-1
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
  selector:
    app: my-server

